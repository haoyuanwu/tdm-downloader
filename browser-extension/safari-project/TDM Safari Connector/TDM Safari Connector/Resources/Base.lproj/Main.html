<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="128" height="128" alt="TDM Safari Connector Icon">
    <h1>连接 Safari 与 TDM</h1>
    <p class="state-unknown">在 Safari 扩展设置中启用「TDM 下载助手」，再允许访问需要下载的网站。</p>
    <p class="state-on">扩展已启用。允许访问下载网站并刷新网页，即可点击文件链接或使用右键菜单交给 TDM 下载。</p>
    <p class="state-off">扩展尚未启用。打开 Safari 扩展设置，勾选「TDM 下载助手」。</p>
    <button class="open-preferences">打开 Safari 扩展设置</button>
    <p class="install-hint">临时签名试用版：若扩展没有出现，请在 Safari 的「开发」菜单中允许未签名的扩展。完整教程见 TDM → 设置 → 浏览器扩展。</p>
</body>
</html>
