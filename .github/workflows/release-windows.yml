name: 发布 Windows 安装包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已有 Release 的版本标签（例如 v0.3.1）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 检查发布版本
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw '标签与源码版本号不一致' }
      - run: npm ci
      - name: 构建安装包与完整免安装包
        run: npm run package:prefix
      - name: 验证后端与浏览器连接器
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test browser-extension/chrome/background.test.cjs browser-extension/chrome/popup.test.cjs browser-extension/native-windows/integration.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 生成校验文件并上传 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $setup = "release/TDM-Downloader_${version}_x64-setup.exe"
          $portable = "release/TDM-Downloader_${version}_x64_portable.zip"
          @($setup, $portable) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Set-Content -Encoding utf8 release/SHA256SUMS-windows.txt
          gh release upload $env:RELEASE_TAG $setup $portable release/SHA256SUMS-windows.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            release/TDM-Downloader_*_x64-setup.exe
            release/TDM-Downloader_*_x64_portable.zip
            release/SHA256SUMS-windows.txt
